name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest playwright pillow && playwright install --with-deps chromium
      - run: python3 build.py && git diff --exit-code dist/   # dist must be rebuilt and committed
      - name: pytest (failures are shown as annotations on the pull request)
        shell: bash
        run: |
          pytest -q tests --tb=short -rf 2>&1 | tee pytest.log; st=${PIPESTATUS[0]}
          if [ $st -ne 0 ]; then { grep -E '^(FAILED |ERROR |E   )' pytest.log | head -30; tail -n 12 pytest.log; } | sed 's/^/::error::/'; fi
          exit $st
