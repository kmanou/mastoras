name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest playwright pillow && playwright install --with-deps chromium
      - run: python3 build.py && git diff --exit-code dist/   # dist must be rebuilt and committed
      - run: pytest -q tests
