# Δημοσίευση στο GitHub Pages (https://kmanou.github.io/mastoras/) σε κάθε αλλαγή του main.
# Απαιτεί Settings → Pages → Source: GitHub Actions.
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py && mkdir -p site && cp dist/mastoras.html site/index.html && cp dist/mastoras.html site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
